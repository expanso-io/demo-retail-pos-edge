# Point of sale at the edge: replace the example stages with the demo's real ones.
# All-demos rules (../AGENTS.md): real data in through the input, log lines
# a viewer cares about, a real output (never drop), lines under 100 chars,
# no blank lines inside config. `just pipeline-check` enforces them.
name: demo-retail-pos-edge
description: Point of sale at the edge
type: pipeline
selector:
  match_labels:
    demo: demo-retail-pos-edge
config:
  input:
    # scripts/producer.py posts records here: data driven from outside.
    http_server:
      address: '127.0.0.1:${DEMO_INGEST_PORT:18100}'
      path: /ingest
      allowed_verbs: [POST]
  pipeline:
    processors:
      - mapping: |
          root = this
          root.received_at = now()
      - log:
          level: INFO
          message: 'record ${! this.seq.or("?") } from ${! this.source.or("producer") }'
  output:
    # Replace with the demo's real destination. Never drop: Expanso Cloud's
    # Output Data Rate should show what this pipeline delivers.
    file:
      path: '${DEMO_SINK:./.runtime/sink.jsonl}'
      codec: lines
